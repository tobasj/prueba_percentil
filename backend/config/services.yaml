parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # Autoregistro de clases, antes de las definiciones explícitas para que estas últimas prevalezcan
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Domain/'
            - '../src/Application/Valuation/'

    App\Infrastructure\Persistence\InMemoryBrandFactorRepository: ~

    App\Domain\Valuation\Rule\BrandRule:
        arguments: ['@App\Infrastructure\Persistence\InMemoryBrandFactorRepository']
        tags: ['valuation.rule']

    App\Domain\Valuation\Rule\ConditionRule:
        tags: ['valuation.rule']

    App\Domain\Valuation\Rule\CategoryRule:
        tags: ['valuation.rule']

    App\Domain\Valuation\Rule\FloorCeilingRule:
        arguments: [10, 500]
        tags: ['valuation.rule']

    App\Domain\Valuation\ValuationService:
        arguments:
            $rules: !tagged_iterator valuation.rule
            $base: 100

    App\Application\Valuation\EstimateValuationHandler: ~

    App\UI\Http\Validation\ValuationRequestValidator: ~

    # Evitar autowire de DTOs con escalares requeridos
    App\Application\Valuation\ValuationRequest:
        autowire: false
        autoconfigure: false
        public: false
        arguments: ['', '', 'fair']

    App\Application\Valuation\ValuationResponse:
        autowire: false
        autoconfigure: false
        public: false
        arguments: [0, 0, 0, 0, []]

    App\UI\Http\ValuationController:
        arguments:
            $handler: '@App\Application\Valuation\EstimateValuationHandler'
            $validator: '@App\UI\Http\Validation\ValuationRequestValidator'
        tags: ['controller.service_arguments']

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']